<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quests | EdVenture</title>
    <link rel="stylesheet" href="css/profile-style.css">
    <link rel="stylesheet" href="css/quests.css">
</head>
<body>
    <div class="background-overlay"></div>

    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="header-left">
                    <a href="dashboard.html" class="logo">
                        <i class="fas fa-graduation-cap"></i>
                        <span>EdVenture</span>
                    </a>
                    <nav class="nav">
                        <a href="dashboard.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>Home</span>
                        </a>
                        <a href="learn.html" class="nav-link">
                            <i class="fas fa-book-open"></i>
                            <span>Learn</span>
                        </a>
                        <a href="quests.html" class="nav-link active">
                            <i class="fas fa-bullseye"></i>
                            <span>Quests</span>
                        </a>
                        <a href="friends.html" class="nav-link">
                            <i class="fas fa-user-friends"></i>
                            <span>Friends</span>
                        </a>
                        <a href="profile.html" class="nav-link">
                            <i class="fas fa-user"></i>
                            <span>Profile</span>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <main class="quests-main">
        <div class="container quests-container">
            <section class="quests-heading">
                <p class="quests-eyebrow">TODAY'S CHALLENGES</p>
                <h1>Daily Quests</h1>
                <p>Small goals, steady progress.</p>
            </section>

            <div id="questsStatus" class="quests-status" role="status">Loading quests...</div>
            <section id="questsGrid" class="quests-grid" aria-live="polite"></section>
        </div>
    </main>

    <div id="confetti" class="quest-confetti" aria-hidden="true"></div>

    <script src="js/api.js"></script>
    <script src="js/checkloggedin.js"></script>
    <script src="js/quests.js"></script>
</body>
</html>
