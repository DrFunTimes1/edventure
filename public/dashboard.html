<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - EdVenture</title>

    <link rel="stylesheet" href="css/profile-style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="background-overlay"></div>

<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="header-left">
                <h1 class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>EdVenture</span>
                </h1>

                <nav class="nav">
                    <a href="dashboard.html" class="nav-link active">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <a href="learn.html" class="nav-link">
                        <i class="fas fa-book-open"></i>
                        <span>Learn</span>
                    </a>
                    <a href="quests.html" class="nav-link">
                        <i class="fas fa-bullseye"></i>
                        <span>Quests</span>
                    </a>
                    <a href="friends.html" class="nav-link">
                        <i class="fas fa-user-friends"></i>
                        <span>Friends</span>
                    </a>
                    <a href="profile.html" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </nav>
            </div>

            <div class="header-right">
                <div class="user-info">
                    <span class="welcome-text" id="welcomeText">Welcome, Explorer!</span>
                    <img src="images/default-avatar.png" alt="Avatar" class="header-avatar">
                </div>
            </div>
        </div>
    </div>
</header>

<main class="dashboard-main">
    <div class="container dashboard-container">
        <section class="dashboard-welcome">
            <div>
                <p class="dashboard-eyebrow">YOUR LEARNING JOURNEY</p>

                <h2 id="dashboardTitle">Welcome back!</h2>
                <p>Keep learning, keep growing.</p>
            </div>
        </section>

        <section class="dashboard-card progress-card">
            <div class="card-header">
                <h3>
                    <i class="fas fa-chart-line"></i>
                    Your Progress
                </h3>
            </div>

            <div class="progress-content">
                <div class="xp-section">
                    <div class="progress-label-row">
                        <span><i class="fas fa-star"></i>XP</span>
                        <strong id="xpText">0 / 1000 XP</strong>
                    </div>

                    <div class="xp-bar">
                        <div id="xpBar" class="xp-fill" style="width: 0%;"></div>
                    </div>

                    <div class="xp-percentage">
                        <span id="xpPercentage">0%</span>
                        <span>to next level </span>
                    </div>
                </div>

                <div class="progress-stat">
                    <span class="progress-stat-label">Level</span>
                    <strong id="level">1</strong>
                </div>

                <div class="progress-stat streak-stat">
                    <span class="progress-stat-label">
                        Current Streak
                    </span>
                    <strong>
                        <i class="fas fa-fire"></i>
                        <span id="currentStreak">0</span>
                        days
                    </strong>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/checkloggedin.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
