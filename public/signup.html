<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EdVenture</title>

    <link rel="stylesheet" href="css/profile-style.css">
    <link rel="stylesheet" href="css/signup.css">
</head>

<body>
    <div class="background-overlay"></div>

    <div class="auth-page">
        <div class="glass-card auth-card-custom">

            <div class="card-header" style="text-align:center;">
                <h3><i class="fas fa-user-plus"></i> Create Account</h3>
            </div>

            <div class="card-body">

                <div class="error-message" id="signupError"></div>
                <div class="success-message" id="signupSuccess"></div>

                <div class="form-row-custom">
                    <label>Full Name</label>
                    <div style="display:flex; gap:1rem;">
                        <input id="signupFName" class="form-input-custom" placeholder="First Name">
                        <input id="signupLName" class="form-input-custom" placeholder="Last Name">
                    </div>
                </div>

                <div class="form-row-custom">
                    <label>Email</label>
                    <input id="signupEmail" class="form-input-custom" placeholder="Email">
                </div>

                <div class="form-row-custom">
                    <label>Grade</label>
                    <input id="signupGrade" class="form-input-custom" placeholder="Grade">
                </div>

                <div class="form-row-custom">
                    <label>Password</label>
                    <input type="password" id="signupPass" class="form-input-custom" placeholder="Password">
                </div>

                <div class="form-row-custom">
                    <label>Confirm Password</label>
                    <input type="password" id="signupConfirmPass" class="form-input-custom" placeholder="Confirm Password">
                </div>

                <button onclick="signup()" class="btn btn-primary" style="width:100%;">
                    Create Account
                </button>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>

            </div>
        </div>
    </div>

    <script src="js/signup.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
