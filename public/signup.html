<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EdVenture</title>

    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/profile-style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card-custom {
            max-width: 500px;
            width: 100%;
        }

        .form-row-custom {
            margin-bottom: 1.25rem;
        }

        .form-row-custom label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-input-custom {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color, rgba(255,255,255,0.1));
            border-radius: var(--border-radius-sm, 12px);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input-custom:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .form-input-custom.error {
            border-color: #ef4444;
        }

        .error-text {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: block;
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.75rem;
        }

        .strength-weak { color: #ef4444; }
        .strength-medium { color: #f59e0b; }
        .strength-strong { color: #10b981; }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .terms-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .terms-row input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .terms-row label {
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .terms-row a {
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="background-overlay"></div>

    <div class="auth-page">
        <div class="glass-card auth-card-custom">

            <div class="card-header" style="text-align:center;">
                <h3><i class="fas fa-user-plus"></i> Create Account</h3>
            </div>

            <div class="card-body">

                <div class="error-message" id="signupError"></div>
                <div class="success-message" id="signupSuccess"></div>

                <div class="form-row-custom">
                    <label>Full Name</label>
                    <div style="display:flex; gap:1rem;">
                        <input id="signupFName" class="form-input-custom" placeholder="First Name">
                        <input id="signupLName" class="form-input-custom" placeholder="Last Name">
                    </div>
                </div>

                <div class="form-row-custom">
                    <label>Email</label>
                    <input id="signupEmail" class="form-input-custom" placeholder="Email">
                </div>

                <div class="form-row-custom">
                    <label>Grade</label>
                    <input id="signupGrade" class="form-input-custom" placeholder="Grade">
                </div>

                <div class="form-row-custom">
                    <label>Password</label>
                    <input type="password" id="signupPass" class="form-input-custom" placeholder="Password">
                </div>

                <div class="form-row-custom">
                    <label>Confirm Password</label>
                    <input type="password" id="signupConfirmPass" class="form-input-custom" placeholder="Confirm Password">
                </div>

                <button onclick="signup()" class="btn btn-primary" style="width:100%;">
                    Create Account
                </button>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>

            </div>
        </div>
    </div>

    <script src="js/signup.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
