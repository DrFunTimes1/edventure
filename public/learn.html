<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EdVenture - Lessons</title>
    <link rel="stylesheet" href="css/profile-style.css"/>
    <link rel="stylesheet" href="css/learn.css"/>
</head>
<body>

<!-- INIT SCREEN -->
<div id="initPanel" class="panel">
    <div class="welcome-card">
        <p class="eyebrow">Welcome back</p>
        <h2 id="welcomeName">Learner</h2>
        <p id="welcomeTier" class="welcome-tier">Current Tier: C</p>
        <p id="welcomeGrade" class="welcome-grade">Loading grade...</p>
    </div>

    <div class="focus-card">
        <h3>Today's Focus</h3>
        <ul id="focusList" class="focus-list"></ul>
    </div>

    <button id="startLearningButton" type="button">Start Learning</button>
    <p id="initStatus"></p>
</div>

<!-- LESSON SCREEN -->
<div id="lessonPanel" class="panel hidden">

    <div id="questionText" class="question">Loading...</div>

    <div id="optionsGrid" class="options"></div>

    <button id="checkAnswerButton">Check Answer</button>
    <button id="clearOrderButton" class="secondary hidden" type="button">Clear Order</button>

    <div id="answerStatus"></div>

    <div id="resultPanel" class="result hidden">
        <div>
            <b>Your Answer:</b> <span id="userAnswer"></span>
        </div>
        <div>
            <b>Correct Answer:</b> <span id="correctAnswer"></span>
        </div>

        <div id="explanation"></div>
    </div>

    <button id="nextQuestionButton">Next Question</button>
    <button id="openDoubtButton" class="hidden">Need help? Ask a quick doubt</button>

    <div id="lessonCompletePanel" class="result hidden lesson-complete">
        <h3>Lesson Finished!</h3>
        <div id="confetti" aria-hidden="true"></div>
    </div>
</div>

<!-- DOUBT SIDEBAR -->
<div id="doubtOverlay" class="overlay"></div>

<div id="doubtPanel" class="doubt-panel">
    <button id="closeDoubtButton">X</button>

    <div id="doubtMessages" class="messages"></div>

    <form id="doubtForm">
        <input id="doubtInput" placeholder="Ask your doubt..." />
        <button type="submit">Send</button>
    </form>
</div>


<script src="js/api.js"></script>
<script src="js/checkloggedin.js"></script>
<script src="js/learn.js"></script>
</body>
</html>
